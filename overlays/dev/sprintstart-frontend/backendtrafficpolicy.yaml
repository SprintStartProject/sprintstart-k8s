# Ersatz für die nginx-Annotationen proxy-read/send-timeout: 3600 (lange KI-Antworten).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: sprintstart-default-timeouts
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sprintstart-default
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sprintstart-dev
  timeout:
    http:
      requestTimeout: 3600s
